name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.actor }}/perioperativeassistant:latest .

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.actor }}/perioperativeassistant:latest

      - name: Azure Login
       uses: azure/login@v2
       with:
        auth-type: SERVICE_PRINCIPAL
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name perioperativeassistant \
            --resource-group PerioperativeAssistant \
            --image ghcr.io/${{ github.actor }}/perioperativeassistant:latest
