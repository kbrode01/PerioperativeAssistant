name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate version tag
        id: vars
        run: echo "VERSION=v${{ github.run_number }}-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Enable Docker build cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ github.sha }}
          restore-keys: |
            buildx-

      - name: Build Docker image
        run: |
          docker buildx build \
            --cache-from=type=local,src=/tmp/.buildx-cache \
            --cache-to=type=local,dest=/tmp/.buildx-cache,mode=max \
            -t ghcr.io/${{ github.actor }}/perioperativeassistant:${{ steps.vars.outputs.VERSION }} \
            --load \
            .
          
          docker tag ghcr.io/${{ github.actor }}/perioperativeassistant:${{ steps.vars.outputs.VERSION }} \
                     ghcr.io/${{ github.actor }}/perioperativeassistant:latest

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.actor }}/perioperativeassistant:${{ steps.vars.outputs.VERSION }}
          docker push ghcr.io/${{ github.actor }}/perioperativeassistant:latest

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name perioperativeassistant \
            --resource-group PerioperativeAssistant \
            --image ghcr.io/${{ github.actor }}/perioperativeassistant:${{ steps.vars.outputs.VERSION }}
